name: Sync upstream releases

on:
  schedule:
    # Daily at 03:17 UTC (11:17 China Standard Time); GitHub may delay scheduled runs.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Required for git push with the built-in, repository-scoped token.
          persist-credentials: true

      - name: Mirror upstream and prepare a stable-release PR
        run: python3 scripts/sync_upstream.py

      - name: Report a stopped sync without overwriting main
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          title='Upstream sync needs attention'
          existing="$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq '.[] | select(.title == "Upstream sync needs attention") | .number' | head -n 1)"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --body \
              "Upstream sync stopped. main was not overwritten. Review conflicts, rewritten upstream refs, missing MECHREVO matches, or GitHub token/PR permissions before retrying. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            echo "Attention issue #${existing} is already open; see this run's logs."
          fi
